server:
  port: 8080

spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:h2:file:./data/urlshortener;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  base-url: http://localhost:8080
  short-code:
    min-length: 6
  rate-limit:
    enabled: false
    capacity: 60
    refill-per-minute: 60
    trust-forwarded-header: false

logging:
  level:
    com.assessment.urlshortener: INFO
